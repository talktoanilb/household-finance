name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (Java 21, Spring Boot, Flyway)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: household
          POSTGRES_USER: household
          POSTGRES_PASSWORD: household
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U household -d household"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: core
    env:
      DB_URL: jdbc:postgresql://localhost:5432/household
      DB_USER: household
      DB_PASSWORD: household
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (applies all Flyway migrations to the CI database)
        run: mvn -B verify

  agent:
    name: agent (Python, LangGraph)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
