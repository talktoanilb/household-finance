# Local development database only. Not for production; these credentials are throwaway.
# Start: docker compose up -d db
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: household
      POSTGRES_USER: household
      POSTGRES_PASSWORD: household
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only, never exposed to the network
    volumes:
      - household-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U household -d household"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  household-db:
