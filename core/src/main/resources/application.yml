spring:
  application:
    name: household-finance-core
  datasource:
    # Credentials come from environment variables. The defaults are for local development only
    # (see docker-compose.yml). Production secrets live in AWS Secrets Manager, never in this file.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/household}
    username: ${DB_USER:household}
    password: ${DB_PASSWORD:household}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Photos are limited to 10 MB in DocumentImportService; Spring's own default (1 MB) would refuse real photos first.
      max-file-size: 10MB
      max-request-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: ${PORT:8080}
  # There is no login yet (M3), so the app listens on this computer only. Do not change this on a shared network.
  address: ${BIND_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
