spring:
  application:
    name: household-finance-core
  datasource:
    # Credentials come from environment variables. The defaults are for local development only
    # (see docker-compose.yml). Production secrets live in AWS Secrets Manager, never in this file.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/household}
    username: ${DB_USER:household}
    password: ${DB_PASSWORD:household}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
